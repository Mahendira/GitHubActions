name: Feature-to-code verification with coverage

on:
  workflow_dispatch:
    inputs:
      feature_path:
        description: 'Feature file to use as the source for generated service code and verification.'
        required: false
        default: 'Business_requirements_001.feature'
        type: string
      coverage_threshold:
        description: 'Minimum coverage required for the generated application code.'
        required: false
        default: '90'
        type: string

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov

      - name: Generate application code from the feature
        shell: bash
        run: |
          set -e
          feature_path="${{ inputs.feature_path }}"
          if [[ -z "$feature_path" ]]; then
            feature_path="Business_requirements_001.feature"
          fi
          python scripts/generate_application_from_tests.py --feature "$feature_path" --app-dir app --test-dir tests

      - name: Run generated tests with coverage gate
        shell: bash
        run: |
          set -e
          feature_path="${{ inputs.feature_path }}"
          if [[ -z "$feature_path" ]]; then
            feature_path="Business_requirements_001.feature"
          fi

          feature_name="${feature_path##*/}"
          module_name="${feature_name%.feature}"
          module_name="${module_name// /_}"
          module_name="${module_name//-/_}"
          module_name="${module_name,,}_service"

          test_path="tests/test_${module_name}.py"
          if [[ ! -f "$test_path" ]]; then
            echo "Generated test file not found: $test_path"
            exit 1
          fi

          python -m pytest "$test_path" --cov="app.${module_name}" --cov-report=term-missing --cov-report=xml --cov-fail-under=${{ inputs.coverage_threshold }} -q

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            .coverage
