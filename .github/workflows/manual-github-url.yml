name: Generate feature in GitHub repo by URL

on:
  workflow_dispatch:
    inputs:
      # The user enters the actual value here in the GitHub Actions UI when they click "Run workflow".
      # Example: github_repo_url: https://github.com/Mahendira/testingactions.git
      # This is not a file to edit in the repo; it is runtime input.
      github_repo_url:
        description: 'GitHub repository URL to clone before generating the feature file.'
        required: true
        default: 'https://github.com/Mahendira/testingactions.git'
        type: string
      repo_visibility:
        description: 'Visibility for a repository created automatically when it does not exist. Example: private (default) or public.'
        required: false
        default: 'private'
        type: choice
        options:
          - private
          - public
      requirement_name:
        description: 'Base requirement filename without extension. Example: Business_requirements_001'
        required: false
        default: 'Business_requirements_001'
        type: string
      requirement_text:
        description: 'Requirement text to save into a .txt file and use to generate the .feature file.'
        required: true
        default: 'The system should allow a user to create an order and track its status.'
        type: string

jobs:
  generate-feature-in-github-repo:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-4o-mini
      GH_TOKEN: ${{ secrets.GH_PAT }}

    steps:
      - name: Check out current repository
        uses: actions/checkout@v4

      - name: Validate GitHub token for repo operations
        shell: bash
        run: |
          set -e
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "ERROR: GH_PAT is missing or empty."
            echo "This workflow needs a PAT with permission to create and access GitHub repositories."
            echo "Fix: add a repository secret named GH_PAT in GitHub -> Settings -> Secrets and variables -> Actions."
            echo "Create the PAT from the same account/org that owns the target repository."
            echo "Required permissions: Contents (Read and write), Metadata (Read), Administration (Read and write)."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ensure target GitHub repo exists
        shell: bash
        run: |
          set -e
          repo_url="${{ inputs.github_repo_url }}"
          if [[ "$repo_url" =~ ^https://github.com/([^/]+)/([^/.]+)(\.git)?$ ]]; then
            owner="${BASH_REMATCH[1]}"
            repo_name="${BASH_REMATCH[2]}"
            echo "Checking GitHub repo: ${owner}/${repo_name}"
            if gh repo view "${owner}/${repo_name}" --json nameWithOwner >/dev/null 2>&1; then
              echo "Repository already exists and is accessible."
            else
              visibility="${{ inputs.repo_visibility }}"
              echo "Repository does not exist yet. Creating ${owner}/${repo_name} as ${visibility}..."
              gh repo create "${owner}/${repo_name}" --${visibility}
            fi
          fi

      - name: Clone target repo and generate feature file
        shell: bash
        run: |
          set -e
          repo_url="${{ inputs.github_repo_url }}"
          if [[ -n "${GH_TOKEN:-}" && "$repo_url" == https://* ]]; then
            repo_url="${repo_url#https://}"
            repo_url="https://x-access-token:${GH_TOKEN}@${repo_url}"
          fi
          git clone --depth 1 "$repo_url" /tmp/target-repo
          python scripts/generate_feature_from_requirement.py \
            --repo-target "/tmp/target-repo" \
            --requirement-name "${{ inputs.requirement_name }}" \
            --requirement-text "${{ inputs.requirement_text }}"
