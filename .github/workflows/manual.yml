name: Generate feature from business requirements

on:
  push:
    branches:
      - main
    paths:
      - '**/Business_requirements_*.txt'
  workflow_dispatch:
    inputs:
      requirement_path:
        description: 'Optional path to a Business_requirements_*.txt file to convert to a feature file.'
        required: false
        type: string

jobs:
  generate-feature:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-4o-mini

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Cucumber feature file(s)
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.requirement_path }}" ]]; then
            python scripts/generate_feature_from_requirement.py "${{ inputs.requirement_path }}"
          else
            python scripts/generate_feature_from_requirement.py
          fi

      - name: Commit generated feature files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No feature files were generated."
          else
            git commit -m "Generate feature files from business requirement text"
            git push
          fi
